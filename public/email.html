 <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Revolut Official 4-Email Template Studio</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
      <style>
        :root {
          --font-family: 'Inter', system-ui, -apple-system, sans-serif;
          --color-primary: #0f172a;
          --color-bg: #f8fafc;
          --color-card: #ffffff;
          --color-text: #0f172a;
          --color-muted: #64748b;
          --color-border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--color-bg); color: var(--color-text); min-height: 100vh; padding: 32px 20px; }
        .container { max-width: 980px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid
  var(--color-border); }
        .logo-badge { display: flex; align-items: center; gap: 12px; }
        .tag { background: #0f172a; color: #ffffff; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; text-transform: uppercase;
  letter-spacing: 0.04em; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        .card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,
  0,0.03); }
        .card-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
        .card-desc { font-size: 13px; color: var(--color-muted); margin-bottom: 20px; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none;
  transition: border-color 0.2s; background: #fff; }
        input:focus, select:focus, textarea:focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,0.1); }

        .pattern-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .pattern-tab { padding: 10px 18px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 13px; font-weight: 700; color:
  #475467; cursor: pointer; transition: all 0.2s; }
        .pattern-tab.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #0f172a; color: #fff; font-weight: 700; font-
  size: 14px; padding: 11px 22px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; text-decoration: none; }
        .btn:hover { background: #1e293b; }
        .btn-secondary { background: #f1f5f9; color: #334155; font-size: 12.5px; padding: 7px 14px; border-radius: 6px; border: 1px solid #cbd5e1; cursor:
  pointer; font-weight: 700; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-email { background: #ea4335; color: #fff; }

        .result-box { margin-top: 24px; padding: 20px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 14px; }

        /* EXACT REVOLUT OFFICIAL EMAIL STYLING MATCHING SCREENSHOTS */
        .email-container { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; max-width: 600px; margin: 16px auto 0 auto; padding: 32px
  28px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #0f172a; text-align: left; }
        .email-logo { text-align: center; margin-bottom: 28px; padding-bottom: 12px; border-bottom: 1px solid #f1f5f9; }
        .email-greeting { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
        .email-text { font-size: 14px; color: #334155; line-height: 1.6; margin-bottom: 18px; }
        .email-callout { background: #f1f5f9; border-radius: 8px; padding: 20px 24px; font-size: 15px; font-weight: 600; color: #0f172a; line-height: 1.5;
  text-align: center; margin: 20px 0; }
        .email-cta-wrap { text-align: left; margin: 24px 0; }
        .email-cta-btn { display: inline-block; background: #0044FF; color: #ffffff !important; font-weight: 700; font-size: 15px; padding: 14px 36px;
  border-radius: 6px; text-decoration: none; letter-spacing: 0.01em; }
        .email-sig { font-size: 14px; color: #0f172a; line-height: 1.6; margin-top: 24px; }
        .email-footer { font-size: 12.5px; color: #64748b; margin-top: 32px; padding-top: 20px; border-top: 1px solid #e2e8f0; line-height: 1.6; }

        .social-links { display: flex; gap: 14px; color: #94a3b8; font-size: 16px; margin: 20px 0; }
      </style>
    </head>
    <body>
      <div class="container">
        <header>
          <div class="logo-badge">
            <svg width="120" height="28" viewBox="0 0 120 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12.5 4H4v20h4.5v-7.5h4L16 24h5.2l-3.8-8.2c2.4-.9 4.1-3 4.1-5.9 0-3.5-2.7-5.9-9-5.9zm-4 8.5V7.8h4c2.8 0 4.2 1 4.2 2.4s-1.4 2.3-4.2
  2.3h-4z" fill="#0f172a"/>
              <path d="M31.2 13.6c0-3.8-2.6-6-6.5-6-4.1 0-6.7 2.5-6.7 6.4 0 3.8 2.6 6.3 6.8 6.3 3.8 0 6.2-2 6.4-5.2h-4.2c-.2 1.4-1 2.1-2.2 2.1-1.4 0-2.2-
  1-2.2-2.7v-.9h8.6v-.3zm-8.8-1.5c.1-1.4.9-2.3 2.3-2.3s2.1.9 2.2 2.3h-4.5z" fill="#0f172a"/>
              <path d="M37 7.9l-3.8 12.3h4.3l2-7.1 2 7.1h4.3L42 7.9H37z" fill="#0f172a"/>
            </svg>
            <span class="tag">Official Revolut 4-Email Template Studio</span>
          </div>
          <div>
            <a href="/admin.html" class="btn btn-secondary" style="text-decoration: none;">🔑 Open Link Generator</a>
          </div>
        </header>

        <div class="grid">
          <div class="card">
            <h2 class="card-title">Select Revolut Email Template Pattern</h2>
            <p class="card-desc">Format, customize, and copy 4 official Revolut recruitment email templates matching exact screenshots.</p>

            <!-- 4 Official Revolut Email Tabs -->
            <label>Select Email Pattern:</label>
            <div class="pattern-tabs">
              <button type="button" class="pattern-tab active" onclick="selectPattern('confirm')">1️⃣ Application Confirmed Email</button>
              <button type="button" class="pattern-tab" onclick="selectPattern('request')">2️⃣ Assessment Request (Link Email)</button>
              <button type="button" class="pattern-tab" onclick="selectPattern('outcome')">3️⃣ Outcome / Rejection Email</button>
              <button type="button" class="pattern-tab" onclick="selectPattern('reminder')">4️⃣ Reminder Email</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label for="candName">Candidate Full Name (Leave blank or type name)</label>
                <input type="text" id="candName" placeholder="e.g. SAYYED ADIL or MAHIMA GURJAR" value="" oninput="updateEmailPreview()" />
              </div>
              <div class="form-group">
                <label for="candEmail">Candidate Email Address</label>
                <input type="email" id="candEmail" placeholder="e.g. candidate@example.com" value="" />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label for="jobTitle">Position / Role Title</label>
                <input type="text" id="jobTitle" value="FinCrime Analyst (Investigator)" oninput="updateEmailPreview()" />
              </div>
              <div class="form-group">
                <label for="recruiterName">Recruiter Name</label>
                <input type="text" id="recruiterName" placeholder="e.g. Patrycja Bunalska" value="" oninput="updateEmailPreview()" />
              </div>
              <div class="form-group">
                <label for="recruiterEmail">Recruiter Email (For Signature)</label>
                <input type="text" id="recruiterEmail" placeholder="e.g. recruiter@revolut.com" value="" oninput="updateEmailPreview()" />
              </div>
            </div>

            <div class="form-group" id="assessmentLinkGroup">
              <label for="candidateLink">Assessment Single-Use Link (For Email 2 & 4)</label>
              <input type="text" id="candidateLink" placeholder="https://revolut-hirevue-app-eu.vercel.app/?token=cand_..." value="https://revolut-
  hirevue-app-eu.vercel.app" oninput="updateEmailPreview()" />
            </div>

            <div class="result-box">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
                <div style="font-size: 14px; font-weight: 800; color: #166534;" id="patternTitleText">1️⃣ Application Confirmed Email Preview</div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  <button type="button" class="btn btn-secondary" onclick="copyEmailHTML()">📋 Copy Email HTML Code</button>
                  <button type="button" class="btn btn-secondary" onclick="copyEmailText()">📋 Copy Plain Text</button>
                  <button type="button" class="btn btn-email" onclick="launchEmailProvider()">✉️ Send via Email Client</button>
                </div>
              </div>

              <!-- DYNAMIC EMAIL PREVIEW CONTAINER -->
              <div class="email-container" id="emailHTMLCard"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        let selectedPatternKey = 'confirm';

        // Official Links provided in screenshot instructions:
        const REVOLUT_LOGO_URL = "https://click.revolut.com/f/a/mn9UfZ6KYB7dRgwI5kVqAQ~~/AAD4-xA~/JytqIwQ2JAPUJ-JEEKF836Im-Ni5DxMAJhwTzlHHGTTQZ_Z_f-
  Zg1EMLzUXUJUbFsdSPZL8gn-Pu7yGW5XM6QwsWRgcniI0tEgirRSoOL8Q~";
        const MODERN_HIRE_HELP_URL = "https://revolut.hirevue-app.eu/router/help";
        const HIREVUE_EXPLAINABILITY_URL = "https://webapi.hirevue.com/wp-content/uploads/2022/04/HV_AI_Short-Form_Explainability_1pager.pdf?_ga=2.
  66983982.1896615504.1707838182-2104363993.1707838182";

        function selectPattern(key) {
          selectedPatternKey = key;
          document.querySelectorAll('.pattern-tab').forEach(tab => tab.classList.remove('active'));
          event.target.classList.add('active');

          const titles = {
            confirm: "1️⃣ Application Confirmed Email Preview",
            request: "2️⃣ Assessment Request (Link Email) Preview",
            outcome: "3️⃣ Outcome / Rejection Email Preview",
            reminder: "4️⃣ Reminder Email Preview"
          };
          document.getElementById('patternTitleText').innerText = titles[key];

          updateEmailPreview();
        }

        function updateEmailPreview() {
          const name = document.getElementById('candName').value.trim() || '[CANDIDATE NAME]';
          const role = document.getElementById('jobTitle').value.trim() || 'FinCrime Analyst (Investigator)';
          const recruiter = document.getElementById('recruiterName').value.trim();
          const recruiterEmail = document.getElementById('recruiterEmail').value.trim();
          const url = document.getElementById('candidateLink').value.trim() || 'https://revolut-hirevue-app-eu.vercel.app';

          const card = document.getElementById('emailHTMLCard');

          // Shared Logo Header linking to official Revolut click URL
          const logoHeader = `
            <div class="email-logo">
              <a href="${REVOLUT_LOGO_URL}" target="_blank">
                <svg width="140" height="32" viewBox="0 0 120 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12.5 4H4v20h4.5v-7.5h4L16 24h5.2l-3.8-8.2c2.4-.9 4.1-3 4.1-5.9 0-3.5-2.7-5.9-9-5.9zm-4 8.5V7.8h4c2.8 0 4.2 1 4.2 2.4s-1.4 2.3-
  4.2 2.3h-4z" fill="#000000"/>
                  <path d="M31.2 13.6c0-3.8-2.6-6-6.5-6-4.1 0-6.7 2.5-6.7 6.4 0 3.8 2.6 6.3 6.8 6.3 3.8 0 6.2-2 6.4-5.2h-4.2c-.2 1.4-1 2.1-2.2 2.1-1.4 0-
  2.2-1-2.2-2.7v-.9h8.6v-.3zm-8.8-1.5c.1-1.4.9-2.3 2.3-2.3s2.1.9 2.2 2.3h-4.5z" fill="#000000"/>
                  <path d="M37 7.9l-3.8 12.3h4.3l2-7.1 2 7.1h4.3L42 7.9H37z" fill="#000000"/>
                </svg>
              </a>
            </div>
          `;

          if (selectedPatternKey === 'confirm') {
            // EMAIL 1: Application Confirmed (Screenshot 195038, 195105, 195118)
            card.innerHTML = `
              ${logoHeader}
              <div class="email-greeting" style="font-size: 24px; font-weight: 800;">Hi ${name},</div>
              <div class="email-text">Thank you for your interest in Revolut! We wanted to let you know we received your application for
  <strong>${role}</strong>, and we are delighted that you would consider joining our team.</div>
              <div class="email-text">Every application is carefully evaluated by real people. Our team will review your application and will contact you
  if your qualifications match our needs for the role.</div>
              <div class="email-text">As we're rapidly expanding, our team is engaging in lots of projects, including reviewing your application.<br
  />Given these circumstances, we can't share any individual feedback to candidates that don't move beyond the initial application review phase.</div>
              <div class="email-text">If you don't receive an invitation for a screen call or aren't selected for this position, we invite you to keep an
  eye on our careers page as our growth opens new positions regularly.<br />Thank you again and we wish you the best of luck!</div>

              <div class="email-footer">
                <div class="social-links">𝕏 &bull; f &bull; 📷 &bull; in</div>
                <div style="margin-bottom: 12px;"><a href="#" style="color: #1967d2; text-decoration: underline;">Data Privacy Notice for
  Candidates</a></div>
                <strong style="text-transform: uppercase; color: #64748b; font-size: 11px;">CONFIDENTIAL</strong><br />
                This e-mail and any attachments are confidential and intended solely for the addressee. Revolut Ltd is authorised and regulated by the
  Financial Conduct Authority.
              </div>
            `;
          } else if (selectedPatternKey === 'request') {
            // EMAIL 2: Assessment Request with Link (Screenshot 195320, 195340, 195352)
            const sigName = recruiter ? recruiter : '[RECRUITER NAME]';
            card.innerHTML = `
              ${logoHeader}
              <div class="email-greeting">Hi ${name},</div>
              <div class="email-text">Thank you for your interest in the <strong>${role}</strong> position at Revolut.</div>
              <div class="email-callout">To further evaluate your qualifications, you're invited to complete the next step in the application process —
  our interactive assessment.</div>
              <div class="email-text">Please complete this assessment in a quiet location with no distractions. And take your time to read all
  instructions carefully before responding.</div>
              <div class="email-text">From the time this interview request was sent, you have <strong>72 hour(s)</strong> to complete and submit. After
  completing and submitting your responses, a notification will be sent to Revolut for review.</div>
              <div class="email-text">To best prepare, we advise you review the instructions and helpful tips that show before you start the assessment.
  </div>
              <div class="email-cta-wrap"><a href="${url}" target="_blank" class="email-cta-btn">Get Started</a></div>
              <div class="email-sig">Thank you,<br /><strong>${sigName}</strong><br /><span style="color: #64748b;">Revolut</span></div>

              <div class="email-footer">
                <strong>Need help?</strong><br />
                &bull; <a href="${MODERN_HIRE_HELP_URL}" target="_blank" style="color: #1967d2; text-decoration: underline;">Modern Hire Help
  Centre</a><br />
                &bull; <a href="${HIREVUE_EXPLAINABILITY_URL}" target="_blank" style="color: #1967d2; text-decoration: underline;">Hirevue's
  Explainability Statement</a><br /><br />
                If the button above isn't working, copy and paste this link in a browser:<br />
                <a href="${url}" target="_blank" style="color: #1967d2; word-break: break-all;">[${url}]</a><br /><br />
                <span style="color: #1967d2; text-decoration: underline;">Unsubscribe</span>
              </div>
            `;
          } else if (selectedPatternKey === 'outcome') {
            // EMAIL 3: Application Outcome / Rejection (Screenshot 195503)
            card.innerHTML = `
              ${logoHeader}
              <div class="email-greeting">Hi ${name},</div>
              <div class="email-text">Thanks for taking the time to complete our HireVue assessment.</div>
              <div class="email-text">Unfortunately, this time we won't be moving forward with your application.</div>
              <div class="email-text">Please note that the Revolut cooling-off period lasts six months and applies even if you submit a new application
  using a different email address.</div>
              <div class="email-text">While we aren't able to offer personal feedback on HireVue tests, your response helped us evaluate whether this role
  would be the right one for you, your profile, and Revolut.</div>
              <div class="email-text">We wish you all the best in your future!</div>
              <div class="email-sig">Your Revolut Recruitment Team</div>
              <div class="email-footer"><a href="#" style="color: #1967d2; text-decoration: underline;">Data Privacy Notice for Candidates</a></div>
            `;
          } else if (selectedPatternKey === 'reminder') {
            // EMAIL 4: Reminder Email (Screenshot 200052)
            const sigName = recruiter ? recruiter : '[RECRUITER NAME]';
            const sigEmailHtml = recruiterEmail ? `<br /><a href="mailto:${recruiterEmail}" style="color: #1967d2;">${recruiterEmail}</a>` : '';

            card.innerHTML = `
              ${logoHeader}
              <div class="email-greeting">${name},</div>
              <div class="email-text">This is a reminder that you haven't yet submitted your responses for the <strong>${role}</strong> opportunity.</div>
              <div class="email-cta-wrap">
                <a href="${url}" target="_blank" style="display: inline-block; border: 1.5px solid #0044FF; color: #0044FF !important; font-weight: 700;
  font-size: 14px; padding: 10px 20px; border-radius: 4px; text-decoration: none;">
                  Submit your responses &gt;
                </a>
              </div>
              <div class="email-text">If you need technical assistance, please visit the <a href="${MODERN_HIRE_HELP_URL}" target="_blank" style="color:
  #1967d2; text-decoration: underline;">Modern Hire Help Centre</a>.</div>
              <div class="email-sig">
                <strong>${sigName}</strong><br />
                <span>Revolut</span>${sigEmailHtml}
              </div>
              <div style="text-align: center; margin-top: 30px;">
                <div style="font-size: 24px; color: #3b82f6;">🌐</div>
                <div style="height: 3px; background: #000; width: 100%; margin-top: 16px;"></div>
              </div>
            `;
          }
        }

        function launchEmailProvider() {
          const email = document.getElementById('candEmail').value.trim();
          const name = document.getElementById('candName').value.trim() || 'Candidate';
          const role = document.getElementById('jobTitle').value.trim() || 'FinCrime Analyst (Investigator)';
          const recruiter = document.getElementById('recruiterName').value.trim() || 'Revolut Team';
          const url = document.getElementById('candidateLink').value.trim();

          const subjects = {
            confirm: `Application to ${role} position confirmed`,
            request: `Revolut Assessment Request - ${role}`,
            outcome: `Your application for: ${role} - Revolut`,
            reminder: `Reminder: Complete your Revolut Assessment - ${role}`
          };

          const subject = subjects[selectedPatternKey];
          const encSub = encodeURIComponent(subject);
          const encBody = encodeURIComponent(`Hi ${name},\n\nPlease find your assessment updates below:\n\n${url}\n\nBest regards,
  \n${recruiter}\nRevolut`);

          window.location.href = `mailto:${email}?subject=${encSub}&body=${encBody}`;
        }

        function copyEmailHTML() {
          const card = document.getElementById('emailHTMLCard');
          navigator.clipboard.writeText(card.outerHTML);
          alert('Official Revolut Email HTML Copied to Clipboard! You can now paste this directly into Gmail, Outlook, Titan Mail, or Zoho Mail.');
        }

        function copyEmailText() {
          const name = document.getElementById('candName').value.trim() || 'Candidate';
          const role = document.getElementById('jobTitle').value.trim() || 'FinCrime Analyst';
          const recruiter = document.getElementById('recruiterName').value.trim() || 'Revolut Team';
          const url = document.getElementById('candidateLink').value.trim();

          const texts = {
            confirm: `Hi ${name},\n\nThank you for your interest in Revolut! We wanted to let you know we received your application for ${role}.\n\nBest
  regards,\nRevolut Recruitment Team`,
            request: `Hi ${name},\n\nThank you for your interest in the ${role} position at Revolut.\n\nTo further evaluate your qualifications, please
  complete your interactive assessment using the link below:\n\nGET STARTED: ${url}\n\nThank you,\n${recruiter}\nRevolut`,
            outcome: `Hi ${name},\n\nThanks for taking the time to complete our HireVue assessment.\nUnfortunately, this time we won't be moving forward
  with your application.\n\nYour Revolut Recruitment Team`,
            reminder: `Hi ${name},\n\nThis is a reminder that you haven't yet submitted your responses for the ${role} opportunity.\n\nSubmit your
  responses here: ${url}\n\nThank you,\n${recruiter}\nRevolut`
          };

          navigator.clipboard.writeText(texts[selectedPatternKey]);
          alert('Plain Text Copied!');
        }

        updateEmailPreview();
      </script>
    </body>
    </html>
